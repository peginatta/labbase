type: protocol
id_prefix: PRT
folder: Protocols
description: >
  A lab protocol: practical, numbered steps for the bench. One protocol per note; branches
  ("freeze for later") are their own protocol linked with a 🔀 Fork step.
body: |
  One or two sentences: what this protocol does and when to use it.

  ## Usage log
  Notebook entries that link to this protocol, newest first (generated by labbase — don't edit).
  ⚠️ = a change was proposed. To propose one, write in the notebook entry:
  `- [[<this protocol>]] change:: spin 600 g instead of 500 g` (or `cambio::`).

  <!-- labbase:usage start -->
  <!-- labbase:usage end -->

  ## Sources
  | Part | Source | Notes |
  |---|---|---|
  | | [[@citekey]] | What came from this source (steps, parameters) |
  | | **Lab modification** | What it replaces |

  ## Materials

  ## Procedure
  ### A. First part
  1. Step with numbers in **bold**.

  ## Notes

  ## References
fields:
  organism:
    kind: text
  duration:
    kind: text
    help: e.g. "~1.5 h extraction · 6 days differentiation"
  flask:
    kind: text
    help: Culture vessel the volumes are scaled to (e.g. T175), when it matters.
  version:
    kind: text
    help: Bump when the procedure changes (1.0, 1.1, 2.0…).
  status:
    kind: choice
    options: [draft, validated, archived]
    default: draft
  updated:
    kind: date
  sources:
    kind: list
    of: link
    to: [reference]
    help: The references this protocol is based on ([[@citekey]] notes in References/).
  related:
    kind: list
    of: link
    help: Other protocols or records this one uses or leads to.
